# ByteTrack tracker defaults for mode="track"
# Docs: https://docs.ultralytics.com/modes/track/
# Tinh chỉnh cho xe máy di chuyển nhanh: giảm track_buffer để xóa hồn ma sớm hơn,
# tăng new_track_thresh để tránh tạo track rác từ xe nhỏ.

tracker_type: bytetrack # (str) Tracker backend: botsort|bytetrack
track_high_thresh: 0.35  # (float) Tăng lên để lọc bớt detection mờ của xe máy
track_low_thresh: 0.15   # (float) Ngưỡng phụ khi detection điểm thấp
new_track_thresh: 0.55   # (float) Tăng lên để tránh tạo track rác từ box nhỏ
track_buffer: 25         # (int) Giảm xuống: xóa hồn ma nhanh hơn, tránh box zombie xe máy
match_thresh: 0.7        # (float) Giảm nhẹ: linh hoạt hơn khi xe máy di chuyển nhanh
fuse_score: True         # (bool) Giữ nguyên: ổn định detection yếu
